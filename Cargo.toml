[workspace]
resolver = "2"
members = [
    "crates/kana-core",
    "crates/kana-acp",
    "crates/kana-git",
    "crates/kana-db",
    "crates/kana-pty",
    "crates/kana-mcp",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
