[package]
name = "desktop"
version = "0.1.0"
description = "Kana — le poste de pilotage de vos agents de code"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Le programme s'appelle Kana : c'est ce nom que le Dock affiche quand on lance l'app avec `tauri dev`.
[[bin]]
name = "Kana"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kana-acp = { path = "../../../crates/kana-acp" }
kana-core = { path = "../../../crates/kana-core" }
kana-git = { path = "../../../crates/kana-git" }
kana-db = { path = "../../../crates/kana-db" }
kana-mcp = { path = "../../../crates/kana-mcp" }
kana-pty = { path = "../../../crates/kana-pty" }
tokio = { workspace = true }
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
getrandom = "0.4.3"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
