name: Tests

# On every push and pull request: the Rust tests, then the interface tests.
on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace

  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Logic tests (Vitest)
        run: npm test
      - name: Test browser
        run: npx playwright install --with-deps chromium
      - name: Screen tests (Playwright)
        run: npm run test:e2e

  release-matrix:
    name: Build & Package (${{ matrix.platform }})
    needs: [rust, interface]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
          - platform: ubuntu-latest
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système Linux (WebKitGTK & AppImage)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Installation frontend
        working-directory: apps/desktop
        run: npm ci
      - name: Build Tauri signée & notarisée (macOS / Linux / Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Kana v__VERSION__"
          releaseBody: "Distribution multi-plateformes Kana (macOS DMG notarisé + Homebrew Cask, Linux AppImage/ DEB, Windows MSI/EXE + manifeste Auto-Updater Tauri)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Génération de la formule Homebrew Cask (kana.rb) et du manifeste Auto-Updater
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p dist/homebrew-cask
          DMG_FILE=$(find . -name "*.dmg" -print -quit || true)
          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            SHA256_VAL="\"$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')\""
          else
            SHA256_VAL=":no_check"
          fi
          cat << EOF > dist/homebrew-cask/kana.rb
          cask "kana" do
            version "0.1.0"
            sha256 ${SHA256_VAL}

            url "https://github.com/HarpePluie/kana/releases/download/v#{version}/Kana_#{version}_universal.dmg"
            name "Kana"
            desc "Poste de pilotage multi-agents ACP (Claude, Codex, Gemini, OpenCode)"
            homepage "https://github.com/HarpePluie/kana"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "Kana.app"
            binary "#{appdir}/Kana.app/Contents/MacOS/Kana", target: "kana"

            zap trash: [
              "~/.kana",
              "~/Library/Application Support/com.kana.desktop",
              "~/Library/Caches/com.kana.desktop",
            ]
          end
          EOF
          cat << 'EOF' > dist/homebrew-cask/latest.json
          {
            "version": "0.1.0",
            "notes": "Kana universal release (macOS DMG notarisé, Linux AppImage/DEB, Windows MSI/NSIS)",
            "pub_date": "2026-11-21T00:00:00Z",
            "platforms": {
              "darwin-universal": { "url": "https://github.com/HarpePluie/kana/releases/download/v0.1.0/Kana.app.tar.gz", "signature": "" },
              "linux-x86_64": { "url": "https://github.com/HarpePluie/kana/releases/download/v0.1.0/kana_0.1.0_amd64.AppImage.tar.gz", "signature": "" },
              "windows-x86_64": { "url": "https://github.com/HarpePluie/kana/releases/download/v0.1.0/Kana_0.1.0_x64-setup.nsis.zip", "signature": "" }
            }
          }
          EOF
      - name: Publication de l'artéfact Homebrew Cask & Auto-Updater
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask-kana
          path: dist/homebrew-cask/
