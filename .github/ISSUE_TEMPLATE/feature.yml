name: Proposer une idée
description: Une fonction qui manque ou une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Le besoin
      description: Quel problème voulez-vous résoudre ?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: L'idée
      description: Comment imaginez-vous la solution ? Un exemple ou une capture d'un autre outil aide.
  - type: textarea
    id: alternatives
    attributes:
      label: Autres pistes envisagées
