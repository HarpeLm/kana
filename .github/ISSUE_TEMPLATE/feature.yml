name: Suggest an idea
description: A missing feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How do you picture the solution? An example or a screenshot from another tool helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Other options considered
