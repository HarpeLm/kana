name: Report a bug
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe the problem. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Open…
        2. Click on…
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: Claude Code, Codex, Gemini CLI or OpenCode, and the model used if relevant.
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 15, Apple Silicon
