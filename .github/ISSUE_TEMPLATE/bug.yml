name: Signaler un bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Décrivez le problème. Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
  - type: input
    id: agent
    attributes:
      label: Agent et modèle
      description: Claude Code, Codex, Gemini CLI ou OpenCode, et le modèle utilisé si c'est utile.
  - type: input
    id: system
    attributes:
      label: Système
      placeholder: macOS 15, Apple Silicon
